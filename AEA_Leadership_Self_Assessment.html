<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>The Excellence Academy has moved</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#081429;color:#fff;font-family:Georgia,'Times New Roman',serif;padding:24px;box-sizing:border-box}
.box{max-width:440px;width:100%;border:1px solid rgba(201,168,76,.3);border-top:3px solid #C9A84C;background:#0D1F3C;padding:28px 24px}
.k{font:700 10px/1.4 Arial,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#C9A84C;margin-bottom:12px}
h1{font-weight:400;font-size:28px;margin:0 0 12px}
p{font:15px/1.6 Arial,sans-serif;color:rgba(255,255,255,.75);margin:0 0 14px}
.btn{display:block;width:100%;box-sizing:border-box;text-align:center;background:#C9A84C;color:#081429;font:700 15px Arial,sans-serif;padding:15px;border:0;cursor:pointer;text-decoration:none;margin:6px 0 14px}
small{display:block;font:13px/1.55 Arial,sans-serif;color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<div class="box">
  <div class="k">Apex Excellence Academy</div>
  <h1>The Academy has moved</h1>
  <div id="msg"><p>Taking you to the new address…</p></div>
</div>
<script>
var NEW_BASE='https://apex-training-hub.kmalcolmjoyce.workers.dev/agents/academy/';
var TARGET=NEW_BASE+'AEA_Leadership_Self_Assessment.html'+location.search;
function g(k){try{return localStorage.getItem(k);}catch(e){return null;}}
var app=g('aea_v1'), named=false;
try{named=!!(app&&JSON.parse(app).name);}catch(e){}
if(!named){
  location.replace(TARGET);
}else{
  location.replace('AEA_App.html'+location.search);
}
</script>
</body>
</html>
